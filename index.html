<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Home</title>
    <link rel="icon" type="image/png" href="./assets/icons/icon.png" />
    <link
      rel="preload"
      href="./assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./assets/style.css" />
    <script src="./assets/js/theme-init.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
  </head>

  <body>
    <div class="noise"></div>

    <svg
      class="math-bg"
      viewBox="0 0 1000 1000"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <circle cx="500" cy="500" r="450" stroke-dasharray="4 8" />
      <circle cx="500" cy="500" r="300" opacity="0.5" />
      <circle cx="500" cy="500" r="150" stroke-dasharray="2 6" />
      <line x1="50" y1="500" x2="950" y2="500" opacity="0.3" />
      <line x1="500" y1="50" x2="500" y2="950" opacity="0.3" />
      <ellipse
        cx="500"
        cy="500"
        rx="400"
        ry="120"
        transform="rotate(30 500 500)"
      />
      <ellipse
        cx="500"
        cy="500"
        rx="400"
        ry="120"
        transform="rotate(-60 500 500)"
      />
      <ellipse
        cx="500"
        cy="500"
        rx="400"
        ry="120"
        transform="rotate(75 500 500)"
        stroke-dasharray="10 10"
      />
    </svg>

    <div id="dynamic-effects" aria-hidden="true"></div>
    <canvas
      class="fireworks-canvas"
      id="fireworks-canvas"
      aria-hidden="true"
    ></canvas>

    <div class="top-actions">
      <button
        class="top-action-btn theme-toggle-btn"
        id="theme-toggle-btn"
        type="button"
        aria-label="Switch theme"
        title="Switch theme"
      >
        <span class="theme-icon theme-icon-sun" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <line x1="12" y1="2" x2="12" y2="4" />
            <line x1="12" y1="20" x2="12" y2="22" />
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34" />
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07" />
            <line x1="2" y1="12" x2="4" y2="12" />
            <line x1="20" y1="12" x2="22" y2="12" />
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66" />
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93" />
          </svg>
        </span>
        <span class="theme-icon theme-icon-moon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </span>
      </button>

      <button
        class="top-action-btn settings-btn"
        id="settings-btn"
        type="button"
        aria-label="Settings"
        title="Settings"
      >
        <svg
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3.2" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.04 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04Z"
          />
        </svg>
      </button>

      <button
        class="top-action-btn add-bookmark-btn"
        id="add-bookmark-btn"
        type="button"
        aria-label="Add bookmark"
        title="Add bookmark"
      >
        <span aria-hidden="true">+</span>
      </button>
    </div>

    <main class="container">
      <div class="header">
        <div class="time">
          <span id="clock">00:00</span
          ><span class="time-period hidden" id="clock-period"></span>
        </div>
        <div class="greeting" id="greeting">Welcome back.</div>
      </div>

      <div class="search-wrapper" role="search">
        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="Search..."
          aria-label="Search or enter address"
          autocomplete="off"
          autofocus
        />
      </div>

      <nav class="shortcuts-nav" aria-label="Bookmarks">
        <ul class="shortcuts" id="links"></ul>
      </nav>
    </main>

    <div class="weather hidden" id="weather">
      <span id="wx-temp">--°</span>
      <span id="wx-city"></span>
      <span class="sr-only" id="wx-description"></span>
    </div>

    <div class="toast hidden" id="toast" role="status">
      <span id="toast-message"></span>
      <button class="toast-action hidden" id="toast-action" type="button">
        Undo
      </button>
    </div>
    <div class="sr-only" id="announcer" role="status"></div>

    <dialog
      class="dialog"
      id="settings-dialog"
      aria-labelledby="settings-title"
      aria-describedby="settings-description"
    >
      <form class="dialog-card" id="settings-form" novalidate>
        <h2 id="settings-title">Welcome to ProdTab</h2>
        <p class="dialog-description" id="settings-description">
          Set up your name and city once. You can change them any time.
        </p>

        <label for="settings-name">What's your name?</label>
        <input
          id="settings-name"
          type="text"
          autocomplete="given-name"
          maxlength="40"
          required
        />

        <label for="settings-city">
          Which city should weather use?
          <span class="label-hint">Optional</span>
        </label>
        <input
          id="settings-city"
          type="text"
          autocomplete="address-level2"
          maxlength="80"
          aria-describedby="settings-city-status"
        />
        <p
          class="field-status hidden"
          id="settings-city-status"
          aria-live="polite"
        ></p>
        <fieldset class="city-matches hidden" id="settings-city-matches">
          <legend>Which one?</legend>
          <div class="city-match-list" id="settings-city-match-list"></div>
        </fieldset>

        <div class="settings-section hidden" id="settings-preferences">
          <div class="settings-grid">
            <label for="settings-theme">Theme</label>
            <select id="settings-theme">
              <option value="auto">Auto (daylight in your city)</option>
              <option value="system">Match system</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>

            <label for="settings-clock">Clock</label>
            <select id="settings-clock">
              <option value="24">24-hour</option>
              <option value="12">12-hour</option>
            </select>

            <label for="settings-unit">Temperature</label>
            <select id="settings-unit">
              <option value="C">Celsius</option>
              <option value="F">Fahrenheit</option>
              <option value="K">Kelvin</option>
            </select>

            <label for="settings-engine">Search engine</label>
            <select id="settings-engine"></select>
          </div>

          <div class="hidden" id="settings-custom-engine-row">
            <label for="settings-custom-engine">Custom search address</label>
            <input
              id="settings-custom-engine"
              type="url"
              maxlength="500"
              placeholder="https://example.com/search?q=%s"
              aria-describedby="settings-custom-engine-hint"
            />
            <p class="field-status" id="settings-custom-engine-hint">
              Put %s where the search words go.
            </p>
          </div>
        </div>

        <p class="form-error hidden" id="settings-error" role="alert"></p>

        <div class="dialog-actions">
          <button class="tool-btn" id="settings-cancel-btn" type="button">
            Cancel
          </button>
          <button class="primary-btn" id="settings-submit-btn" type="submit">
            Save
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      class="dialog"
      id="bookmark-dialog"
      aria-labelledby="bookmark-dialog-title"
    >
      <form class="dialog-card" id="bookmark-form" novalidate>
        <h2 id="bookmark-dialog-title">Add Bookmark</h2>

        <label for="bookmark-name">Bookmark Name</label>
        <input
          id="bookmark-name"
          type="text"
          maxlength="40"
          autocomplete="off"
          required
        />

        <label for="bookmark-url">Bookmark URL</label>
        <input
          id="bookmark-url"
          type="text"
          inputmode="url"
          maxlength="300"
          autocomplete="url"
          placeholder="https://example.com"
          required
        />

        <div class="hidden" id="bookmark-position-row">
          <label for="bookmark-position">Position</label>
          <select id="bookmark-position"></select>
        </div>

        <p class="form-error hidden" id="bookmark-error" role="alert"></p>

        <div class="dialog-actions">
          <button class="tool-btn" id="bookmark-cancel-btn" type="button">
            Cancel
          </button>
          <button class="primary-btn" type="submit">Save Bookmark</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
